<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <title>The computers of SPOT and how they talk to each other</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b93a3"/></marker>
  </defs>
  <rect width="960" height="560" fill="#0f1218" rx="12"/>

  <!-- Your computer -->
  <rect x="16" y="16" width="300" height="528" rx="10" fill="none" stroke="#2d4a7a" stroke-dasharray="6 4"/>
  <text x="30" y="40" fill="#7fb0ff" font-weight="700">Your computer</text>
  <g fill="#161b24" stroke="#3a4558" stroke-width="1.5">
    <rect x="36" y="60" width="260" height="70" rx="8"/>
    <rect x="36" y="180" width="260" height="70" rx="8"/>
    <rect x="36" y="300" width="260" height="70" rx="8"/>
    <rect x="36" y="420" width="260" height="70" rx="8"/>
  </g>
  <g fill="#e6e9ef" font-weight="600">
    <text x="50" y="88">Browser: the SPOT Console page</text>
    <text x="50" y="208">Local console server (app.py --local)</text>
    <text x="50" y="328">MATLAB worker (interface.worker.Worker)</text>
    <text x="50" y="448">MATLAB and Simulink</text>
  </g>
  <g fill="#aeb6c3" font-size="12">
    <text x="50" y="108">Simulation, Experiment, Results, Designer</text>
    <text x="50" y="228">Python standard library; 127.0.0.1 with a token</text>
    <text x="50" y="348">answers one JSON command per line</text>
    <text x="50" y="468">spot.* packages, your diagram, Saved Data</text>
  </g>
  <g stroke="#8b93a3" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)">
    <path d="M166 132V178"/>
    <path d="M166 252V298"/>
    <path d="M166 372V418"/>
  </g>
  <g fill="#89ddff" font-size="11">
    <text x="174" y="160">HTTP + events</text>
    <text x="174" y="280">JSON lines (local socket)</text>
  </g>

  <!-- The lab -->
  <rect x="344" y="16" width="600" height="528" rx="10" fill="none" stroke="#2c5a40" stroke-dasharray="6 4"/>
  <text x="358" y="40" fill="#3ccf7e" font-weight="700">The lab network (192.168.1.x)</text>
  <g fill="#161b24" stroke="#3a4558" stroke-width="1.5">
    <rect x="364" y="60" width="250" height="90" rx="8"/>
    <rect x="680" y="60" width="244" height="60" rx="8"/>
    <rect x="364" y="220" width="250" height="110" rx="8"/>
    <rect x="680" y="200" width="244" height="54" rx="8"/>
    <rect x="680" y="270" width="244" height="54" rx="8"/>
    <rect x="680" y="340" width="244" height="54" rx="8"/>
    <rect x="364" y="420" width="250" height="70" rx="8"/>
  </g>
  <g fill="#e6e9ef" font-weight="600">
    <text x="378" y="86">Lab console: Jetson TX2 (.116)</text>
    <text x="694" y="86">PhaseSpace server (.109)</text>
    <text x="378" y="246">StreamData (on the TX2)</text>
    <text x="694" y="224">Chaser, RED (.110)</text>
    <text x="694" y="294">Target, BLACK (.111)</text>
    <text x="694" y="364">Obstacle, BLUE (.112)</text>
    <text x="378" y="446">Jetson Orin (.115): SPOT Vision</text>
  </g>
  <g fill="#aeb6c3" font-size="12">
    <text x="378" y="106">app.py, lab mode, port 8080: PhaseSpace,</text>
    <text x="378" y="122">Hardware, Designer, Calibration, Vision,</text>
    <text x="378" y="138">Documentation; runs the experiments</text>
    <text x="694" y="106">10 cameras, LED tracking</text>
    <text x="378" y="266">reads the cameras (OWL API) and sends</text>
    <text x="378" y="282">each frame: poses, velocities, LEDs and</text>
    <text x="378" y="298">the experiment clock (UDP 31534)</text>
    <text x="694" y="242">Jetson + Teensy + arm + ZED2</text>
    <text x="694" y="312">Jetson + Teensy</text>
    <text x="694" y="382">Jetson + Teensy</text>
    <text x="378" y="466">cameras, port 8090 (Vision tab)</text>
  </g>
  <g stroke="#8b93a3" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M298 215C330 215 330 105 362 105" marker-start="url(#a)"/>
    <path d="M678 90H616"/>
    <path d="M489 152V218"/>
    <path d="M616 260C650 260 650 227 678 227"/>
    <path d="M616 275H678"/>
    <path d="M616 300C650 300 650 366 678 366"/>
    <path d="M298 455C330 455 330 470 362 460" marker-start="url(#a)" stroke-dasharray="5 4"/>
    <path d="M802 396V500H616" marker-start="url(#a)" stroke-dasharray="3 3"/>
  </g>
  <g fill="#89ddff" font-size="11">
    <text x="326" y="196" font-size="10">HTTP</text>
    <text x="626" y="80">OWL</text>
    <text x="498" y="190">runs it</text>
    <text x="232" y="512">build on the TX2</text>
    <text x="626" y="516">RED ↔ Orin: UDP 46875 / 36845</text>
  </g>
  <text x="358" y="530" fill="#8b93a3" font-size="10.5">Platforms → lab console: clocks UDP 48720-2, messages 55001-3, streams 55011-3.</text><text x="358" y="544" fill="#8b93a3" font-size="10.5">Lab console → platforms: SSH (spot_agent.sh): deploy, start, stop, data, the Teensy.</text>
</svg>
