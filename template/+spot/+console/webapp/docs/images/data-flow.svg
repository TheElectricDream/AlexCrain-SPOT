<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="Segoe UI, system-ui, sans-serif" font-size="13">
  <title>How the diagram's subsystems pass data through data stores within one step</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b93a3"/></marker>
  </defs>
  <rect width="900" height="400" fill="#0f1218" rx="12"/>
  <g fill="#161b24" stroke="#3a4558" stroke-width="1.5">
    <rect x="20" y="40" width="190" height="64" rx="8"/>
    <rect x="270" y="40" width="170" height="64" rx="8"/>
    <rect x="500" y="40" width="150" height="64" rx="8"/>
    <rect x="710" y="40" width="170" height="64" rx="8"/>
    <rect x="690" y="200" width="190" height="64" rx="8"/>
    <rect x="20" y="200" width="190" height="64" rx="8"/>
    <rect x="270" y="310" width="370" height="60" rx="8" fill="#141922"/>
  </g>
  <g fill="#e6e9ef" text-anchor="middle" font-weight="600">
    <text x="115" y="66">PhaseSpace Camera Code</text>
    <text x="115" y="84" font-weight="400" fill="#aeb6c3">or Simulate Plant Dynamics</text>
    <text x="355" y="68">1 - Experiment Logic</text>
    <text x="575" y="68">3 - Guidance</text>
    <text x="795" y="68">4 - Control</text>
    <text x="785" y="226">Thruster &amp; Float</text>
    <text x="785" y="244">Control Code</text>
    <text x="115" y="226">Arm Torques, then</text>
    <text x="115" y="244" font-weight="400" fill="#aeb6c3">Robotic Arm Code or the plant</text>
    <text x="455" y="336">Data Logger · Debugger · Live Data Streams</text>
    <text x="455" y="354" font-weight="400" fill="#aeb6c3">read everything, write nothing the others read</text>
  </g>
  <g stroke="#8b93a3" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M210 72H268"/>
    <path d="M440 72H498"/>
    <path d="M650 72H708"/>
    <path d="M795 104V198"/>
    <path d="M690 232H212"/>
    <path d="M115 104C115 150 760 140 780 104" stroke-dasharray="5 4"/>
    <path d="M760 104C720 170 260 170 160 200"/>
    <path d="M60 200C40 150 60 120 70 106"/>
    <path d="M455 270V308"/>
  </g>
  <g fill="#89ddff" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" text-anchor="middle">
    <text x="239" y="62">Measured_States</text>
    <text x="239" y="92">Univ_Time</text>
    <text x="469" y="62">Desired_States</text>
    <text x="469" y="92">Float_State</text>
    <text x="680" y="62">X_Path</text>
    <text x="840" y="160">X_Controls</text>
    <text x="450" y="226">X_Saturated_Controls (the plant reads them next step)</text>
    <text x="450" y="130">X_Measured_States (the controller reads them too)</text>
    <text x="470" y="174">ARM_Controls</text>
    <text x="22" y="152" text-anchor="start">ARM_Measured_States</text>
  </g>
  <text x="20" y="24" fill="#8b93a3" font-size="12">X = RED, BLACK, BLUE (and ARM where it applies). Arrows: a data store written by one subsystem and read by the next.</text>
</svg>
